<style>
    *{
        padding: 0%;
        margin: 0%;
        box-sizing: border-box;
    }

    width: 100%;
    height: 64px;
    color: white;
    display: flex;

    justify-content: space-around;

    padding: 20px;
    gap: 20px;
}
header h2{
    font-weight: bold;
}
.desktop a{

    font-weight: bold;
    color: white;
    margin: 10px;
}
button{
    background-color: aqua;
    padding: 10px 10px;
    border: none;
    border-radius: 10px;
    color: white;
}
</style>
<body>
     <div class="inner">
            <h2>E Lơn Ling</h2>

            </nav>
        </div>
        
</body>
