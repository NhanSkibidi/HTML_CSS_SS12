<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Select</title>
</head>
<style>
  
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

.faq{
  padding:50px 20px;
}

.faq-header{
  text-align:center;
  margin-bottom:30px;
}

.faq-header span{
  display:inline-block;
  padding:4px 10px;
  background:#e0e7ff;
  color:#4f46e5;
  font-size:12px;
  border-radius:6px;
  margin-bottom:10px;
}

.faq-header h2{
  font-size:32px;
  margin:10px 0;
}
.faq-header p{
  color:#6b7280;
}
.faq-box{
  max-width:800px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.faq-select{
  width:100%;
  padding:16px;
  border-radius:8px;
  border:1px solid #e5e7eb;
  font-size:14px;
}
.faq-select:hover{
    background-color: #6366F1;
}
@media (max-width:600px){
  .faq-header h2{
    font-size:24px;
  }
}

</style>
<body>
<section class="faq">
  <div class="faq-header">
    <span>Câu hỏi thường gặp</span>
    <h2>Bạn có thắc mắc?</h2>
    <p>Chúng tôi sẵn sàng giải đáp mọi thắc mắc của bạn</p>
  </div>

  <div class="faq-box">
    <select class="faq-select">
      <option>Tôi có thể học trên điện thoại không?</option>
      <option>Có, nền tảng tương thích với điện thoại, tablet và máy tính.</option>
    </select>

    <select class="faq-select">
      <option>Chứng chỉ có được công nhận không?</option>
      <option>Chứng chỉ được cấp sau khi hoàn thành khóa học.</option>
    </select>

    <select class="faq-select">
      <option>Tôi có thể hoàn tiền nếu không hài lòng?</option>
      <option>Hỗ trợ hoàn tiền trong vòng 7 ngày.</option>
    </select>

    <select class="faq-select">
      <option>Làm thế nào để liên hệ với giảng viên?</option>
      <option>Liên hệ qua hệ thống hỏi đáp trong khóa học.</option>
    </select>

    <select class="faq-select">
      <option>Tôi có thể tải video về xem offline không?</option>
      <option>Hiện tại chỉ hỗ trợ xem video online.</option>
    </select>
  </div>
</section>

</body>
</html>
